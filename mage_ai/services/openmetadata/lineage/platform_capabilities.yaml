# Mage IO driver -> OpenMetadata database service capability map.
#
# state:
#   supported  - OMD has a database service that can ingest this platform; publish lineage
#   delegated  - OMD can represent it, but this connector cannot analyse it (use another integration)
#   unsupported- OMD has no database service for it; metadata can never be ingested, so skip
#
# `python -m mage_ai.services.openmetadata.lineage platforms` prints the effective map
# so drift is visible in review.

version: 1

drivers:
  postgres:
    platform: Postgres
    state: supported
  postgresql:
    platform: Postgres
    state: supported
  timescale:
    platform: Timescale
    state: supported
  mysql:
    platform: Mysql
    state: supported
  mariadb:
    platform: MariaDB
    state: supported
  mssql:
    platform: Mssql
    state: supported
  sqlserver:
    platform: Mssql
    state: supported
  azuresql:
    platform: AzureSQL
    state: supported
  oracle:
    platform: Oracle
    state: supported
  bigquery:
    platform: BigQuery
    state: supported
  snowflake:
    platform: Snowflake
    state: supported
  redshift:
    platform: Redshift
    state: supported
  clickhouse:
    platform: Clickhouse
    state: supported
  trino:
    platform: Trino
    state: supported
  presto:
    platform: Presto
    state: supported
  druid:
    platform: Druid
    state: supported
  pinot:
    platform: PinotDB
    state: supported
    columns: table_only
  databricks:
    platform: Databricks
    state: delegated
    note: Use the OpenLineage Spark listener for Databricks/Spark column lineage.
  spark:
    platform: Databricks
    state: delegated
    note: Use the OpenLineage Spark listener for Spark column lineage.
  s3:
    platform: null
    state: delegated
    note: Object storage is not a database service; file-level lineage is out of scope.
  google_cloud_storage:
    platform: null
    state: delegated
    note: Object storage is not a database service; file-level lineage is out of scope.
  file:
    platform: null
    state: delegated
    note: Local files are not a database service.
  duckdb:
    platform: null
    state: unsupported
    note: OpenMetadata has no DuckDB database service, so its metadata cannot be ingested.
  sqlite:
    platform: SQLite
    state: unsupported
    note: OMD has a SQLite service, but Mage has no SQLite IO driver.
  kafka:
    platform: null
    state: unsupported
    note: Messaging has no tables or columns to attach lineage to.
  opensearch:
    platform: null
    state: unsupported
    note: Search indexes are not relational tables.
  algolia:
    platform: null
    state: unsupported
    note: Search indexes are not relational tables.
  chroma:
    platform: null
    state: unsupported
    note: Vector stores are not relational tables.
  qdrant:
    platform: null
    state: unsupported
    note: Vector stores are not relational tables.
  weaviate:
    platform: null
    state: unsupported
    note: Vector stores are not relational tables.
  airtable:
    platform: null
    state: unsupported
    note: Airtable is not ingested as a database service.
  google_sheets:
    platform: null
    state: unsupported
    note: Google Sheets is not ingested as a database service.
  api:
    platform: null
    state: unsupported
    note: APIs have no table metadata to attach lineage to.
