name: Build and test

on:
  push:
    paths:
      - "mage_ai/**"
      - "mage_integrations/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
  pull_request:
    paths:
      - "mage_ai/**"
      - "mage_integrations/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"

env:
  ENV: test_mage
  # Keep this in sync with the UV_VERSION build args in the Dockerfiles.
  UV_VERSION: "0.11.29"

jobs:
  packaging:
    runs-on: ubuntu-latest
    name: Check packaging metadata
    steps:
      - uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Check that requirements.txt matches uv.lock
        run: |
          make requirements
          git diff --exit-code -- requirements.txt
      - name: Build the sdist and the wheel
        run: uv build

  test_backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: |
          sudo apt-get install freetds-dev
          uv sync --locked --extra all --extra integrations --group dev
          # Forks and local packages that are not part of the lockfile.
          uv pip install "git+https://github.com/mage-ai/sqlglot#egg=sqlglot"
          uv pip install "git+https://github.com/mage-ai/singer-python.git#egg=singer-python"
          uv pip install ./mage_integrations
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
      - name: Run unit tests
        run: |
          python -m unittest discover -s mage_ai --failfast
        env:
          OPENAI_API_KEY: abcdefg
      - name: Run focused git tests through pytest
        run: |
          pytest mage_ai/tests/data_preparation/git \
            mage_ai/tests/data_preparation/sync/test_git_sync.py -q
      - name: Run mage integrations unit tests
        run: |
          cd mage_integrations && python -m unittest discover mage_integrations.tests

      # Run Playwright web UI tests only run once per workflow (Python 3.10).
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "18.18.0"
        if: matrix.python-version == '3.10'
      - name: Create Mage test project
        run: |
          python mage_ai/cli/main.py init test_project
        env:
          PYTHONPATH: .
        if: matrix.python-version == '3.10'
      - name: Build frontend, start server, and run Playwright tests
        run: |
          yarn install &&
          yarn export_prod &&
          yarn playwright install chromium &&
          yarn playwright test -c playwright.config.ci.ts
        working-directory: mage_ai/frontend/
        env:
          PYTHONPATH: ${{ github.workspace }} # Playwright tests on CI depend on the Python web server
        if: matrix.python-version == '3.10'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: mage_ai/frontend/playwright-report/
          retention-days: 3
          overwrite: true

  test_web_server_windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # Run Playwright web UI tests only run once per workflow (Python 3.10).
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.15.1"
      - name: Create Mage test project
        run: |
          Start-Process -Wait -FilePath "C:\Program Files\Git\unins000.exe" -ArgumentList "/SILENT"
          uv sync --locked --extra all --extra integrations
          "$pwd\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PYTHONPATH = "${env:PYTHONPATH};${pwd}"
          .venv\Scripts\python.exe mage_ai/cli/main.py init test_project
      - name: Build frontend, start server, and run Playwright tests
        run: |
          yarn install &&
          yarn export_prod &&
          yarn playwright install chromium &&
          yarn playwright test -c playwright-windows.config.ci.ts
        working-directory: mage_ai/frontend/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: mage_ai/frontend/playwright-report/
          retention-days: 3
