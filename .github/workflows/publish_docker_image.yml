name: Build and publish Docker image

on:
  workflow_dispatch:
    inputs:
      dockerfile_branch:
        description: 'Dockerfile branch'
        required: true
        default: master
      feature_branch:
        description: 'Feature branch'
        required: false
        default: null
      name:
        description: 'Docker image name'
        required: true
        default: mageai
      tag:
        description: 'Docker image tag'
        required: true
        default: latest

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.dockerfile_branch }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mageai/${{ github.event.inputs.name }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag }}-python${{ matrix.python-version }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ matrix.python-version == '3.12' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
            FEATURE_BRANCH=${{ github.event.inputs.feature_branch }}
