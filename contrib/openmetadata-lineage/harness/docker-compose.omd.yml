# Local OpenMetadata 1.6.5 for the lineage harness.
#
# Uses the released server/ingestion images, so no Maven build is required:
#
#   docker compose -f harness/docker-compose.omd.yml up -d
#
# Host ports: UI 8585, API 8586, OpenSearch 9200. Postgres and the ingestion
# worker stay private to the compose network (the host's 5432/8080 may be busy).

services:
  postgresql:
    image: postgres:15
    container_name: openmetadata_postgresql
    command: --work_mem=10MB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - ./omd/postgres-init.sql:/docker-entrypoint-initdb.d/10-openmetadata.sql:ro
      - omd-db-data:/var/lib/postgresql/data
    networks:
      - omd-net
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -tAc 'select 1' -d openmetadata_db"]
      interval: 10s
      timeout: 10s
      retries: 15

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: openmetadata_opensearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=OpenMetadata_password123!!!
    ports:
      - "9200:9200"
    expose:
      - 9200
    volumes:
      - omd-search-data:/usr/share/opensearch/data
    networks:
      - omd-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 30

  execute-migrate-all:
    image: docker.getcollate.io/openmetadata/server:1.6.5
    container_name: execute_migrate_all
    command: ./bootstrap/openmetadata-ops.sh -d migrate --force
    environment: &omd-env
      OPENMETADATA_CLUSTER_NAME: openmetadata
      SERVER_PORT: "8585"
      SERVER_ADMIN_PORT: "8586"
      LOG_LEVEL: INFO
      MIGRATION_LIMIT_PARAM: "1200"
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_PARAMS: allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USE_SSL: "false"
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: openmetadata_password
      DB_HOST: postgresql
      DB_PORT: "5432"
      ELASTICSEARCH_HOST: opensearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      ELASTICSEARCH_USER: ""
      ELASTICSEARCH_PASSWORD: ""
      SEARCH_TYPE: opensearch
      ELASTICSEARCH_CLUSTER_ALIAS: openmetadata
      ELASTICSEARCH_INDEX_MAPPING_LANG: EN
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
      AUTHORIZER_ALLOWED_REGISTRATION_DOMAIN: '["all"]'
      AUTHORIZER_INGESTION_PRINCIPALS: "[ingestion-bot]"
      AUTHORIZER_PRINCIPAL_DOMAIN: open-metadata.org
      AUTHORIZER_ENFORCE_PRINCIPAL_DOMAIN: "false"
      AUTHORIZER_ENABLE_SECURE_SOCKET: "false"
      AUTHENTICATION_PROVIDER: basic
      AUTHENTICATION_RESPONSE_TYPE: id_token
      AUTHENTICATION_PUBLIC_KEYS: "[http://localhost:8585/api/v1/system/config/jwks]"
      AUTHENTICATION_AUTHORITY: https://accounts.google.com
      AUTHENTICATION_JWT_PRINCIPAL_CLAIMS: "[email,preferred_username,sub]"
      AUTHENTICATION_ENABLE_SELF_SIGNUP: "true"
      AUTHENTICATION_CLIENT_TYPE: public
      FERNET_KEY: jJ/9sz0g0OHxsfxOoSfdFdmk3ysNmPRnH3TUAbz3IHA=
      PIPELINE_SERVICE_CLIENT_ENABLED: "false"
    networks:
      - omd-net
    depends_on:
      postgresql:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  openmetadata-server:
    image: docker.getcollate.io/openmetadata/server:1.6.5
    container_name: openmetadata_server
    environment:
      <<: *omd-env
    ports:
      - "8585:8585"
      - "8586:8586"
    expose:
      - 8585
      - 8586
    networks:
      - omd-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    depends_on:
      postgresql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      execute-migrate-all:
        condition: service_completed_successfully

  # Host-side `metadata ingest` runs from this container (see harness/ingest.sh).
  ingestion:
    image: docker.getcollate.io/openmetadata/ingestion:1.6.5
    container_name: openmetadata_ingestion
    command: ["bash", "-c", "sleep infinity"]
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow_pass@postgresql:5432/airflow_db
      AIRFLOW__WEBSERVER__AUTHENTICATE: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      OPENMETADATA_SERVER_URL: http://openmetadata-server:8585
    volumes:
      - omd-ingestion-dags:/opt/airflow/dags
    networks:
      - omd-net
    depends_on:
      openmetadata-server:
        condition: service_healthy

volumes:
  omd-db-data:
  omd-search-data:
  omd-ingestion-dags:

networks:
  omd-net:
    name: omd-net
