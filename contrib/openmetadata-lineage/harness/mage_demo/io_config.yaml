# Postgres profile used by the Mage IO library inside the Mage container.
# The demo warehouse is published on the host at :5433.
version: 0.1.1
default:
  POSTGRES_HOST: host.docker.internal
  POSTGRES_PORT: "5433"
  POSTGRES_DBNAME: analytics
  POSTGRES_USER: warehouse
  POSTGRES_PASSWORD: warehouse
  POSTGRES_SCHEMA: raw
