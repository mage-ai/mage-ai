# Demo warehouse. Database name matches `profiles.default.database: analytics`
# in tests/fixtures/demo_project/omd_lineage.yaml.
#
#   docker compose -f harness/docker-compose.warehouse.yml up -d
#
# Host port 5433 keeps it clear of an OpenMetadata Postgres on 5432.

services:
  warehouse:
    image: postgres:15
    container_name: mage-omd-warehouse
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: analytics
    ports:
      - "5433:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  warehouse-data:
