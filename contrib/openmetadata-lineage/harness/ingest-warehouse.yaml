# OpenMetadata database metadata ingestion for the demo warehouse.
#
# The service name and database must match the connector profile:
#   profiles.default.service  = warehouse_demo
#   profiles.default.database = analytics
#
# Run with the OpenMetadata ingestion CLI:
#   metadata ingest -c harness/ingest-warehouse.yaml
#
# If ingestion runs in a container, replace localhost with a host reachable from
# that container (for example host.docker.internal on Docker Desktop).

source:
  type: postgres
  serviceName: warehouse_demo
  serviceConnection:
    config:
      type: Postgres
      hostPort: localhost:5433
      username: warehouse
      authType:
        password: warehouse
      database: analytics
      ingestAllDatabases: false
  sourceConfig:
    config:
      type: DatabaseMetadata
      schemaFilterPattern:
        includes:
          - raw
          - stg
          - mart
      tableFilterPattern:
        includes:
          - ".*"

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  openMetadataServerConfig:
    hostPort: http://localhost:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OMD_TOKEN}
