[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mage-omd-lineage"
version = "0.1.0"
description = "Publish Mage pipeline table and column lineage into OpenMetadata"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.28",
  "sqlglot>=25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
mage-omd-lineage = "mage_omd_lineage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mage_omd_lineage*"]

[tool.setuptools.package-data]
mage_omd_lineage = ["platform_capabilities.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
